<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Hardest Challenge</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="THC">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="apple-touch-icon" href="https://i.ibb.co/spJPDfmg/The-Hardest-Challange.png">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; overflow: hidden; background: #0a0a0f; font-family: system-ui, sans-serif; color: #fff; user-select: none; }
      #game { display: block; width: 100vw; height: 100vh; }

      /* Ortak Ekran Stili */
      .screen {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: space-between; padding: 30px 20px;
        background: rgba(10, 10, 15, 0.85); z-index: 10;
      }

      /* Ana Menü */
      #menu .btn-main {
        padding: 18px 70px; font-size: 26px; font-weight: bold; border: none;
        border-radius: 14px; background: linear-gradient(90deg, #ffd700, #ff8c00);
        color: #000; cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 20px rgba(255, 200, 0, 0.4);
        margin-top: 15vh;
      }
      #menu .btn-editor {
        padding: 12px 30px; font-size: 18px; font-weight: bold; border: 2px solid #ff006e;
        border-radius: 10px; background: transparent; color: #ff006e; cursor: pointer;
      }
      #repo-link {
        padding: 12px 30px; font-size: 16px; font-weight: bold; text-decoration: none;
        border: 2px solid #555; border-radius: 10px; color: #fff; background: rgba(255,255,255,0.05);
      }

      /* Bölüm Seçimi */
      #level-select { display: none; }
      #level-select h2 { margin-top: 10vh; font-size: 28px; color: #fff; }
      .level-scroll {
        display: flex; gap: 15px; overflow-x: auto; width: 100%; padding: 20px 10px;
        scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
      }
      .level-scroll::-webkit-scrollbar { display: none; }
      .level-btn {
        flex: 0 0 100px; height: 100px; border-radius: 15px; font-size: 32px; font-weight: bold;
        background: #1a1a2e; color: #ffd700; border: 2px solid #333; cursor: pointer;
        scroll-snap-align: center; display: flex; align-items: center; justify-content: center;
      }
      .level-btn:active { transform: scale(0.95); background: #ffd700; color: #000; }

      /* Editör Ekranı */
      #editor-screen { display: none; padding: 10px; }
      .editor-top { display: flex; gap: 10px; width: 100%; justify-content: center; margin-bottom: 10px; z-index: 20; }
      .editor-top button {
        padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer;
      }
      #btn-save { background: #00ff88; color: #000; }
      #btn-clear { background: #ff006e; color: #fff; }
      #btn-exit-editor { background: #555; color: #fff; }
      #editor-info { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #aaa; font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>
<canvas id="game"></canvas>

<!-- ANA MENÜ -->
<div id="menu" class="screen">
  <button id="btn-play" class="btn-main">OYNA</button>
  <div style="display: flex; flex-direction: column; gap: 15px; align-items: center; margin-bottom: 10vh;">
    <button id="btn-open-editor" class="btn-editor">🛠️ HARİTA YAP</button>
  </div>
  <a id="repo-link" href="https://github.com/thehardestchallange/The-Hardest-Challange/blob/main/README.md" target="_blank">📂 Repo</a>
</div>

<!-- BÖLÜM SEÇİMİ -->
<div id="level-select" class="screen">
  <h2>Bölüm Seç</h2>
  <div class="level-scroll" id="level-container">
    <!-- JS ile doldurulacak -->
  </div>
  <button id="btn-back-menu" style="padding: 12px 30px; background: transparent; color: #fff; border: 2px solid #555; border-radius: 10px; cursor: pointer;">Geri Dön</button>
</div>

<!-- HARİTA EDİTÖRÜ -->
<div id="editor-screen" class="screen">
  <div class="editor-top">
    <button id="btn-save">💾 İndir (JSON)</button>
    <button id="btn-clear">🗑️ Temizle</button>
    <button id="btn-exit-editor">❌ Çıkış</button>
  </div>
  <div id="editor-info">Ekrana tıklayarak diken ekle veya kaldır. (Sadece zeminden yukarı doğru)</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/kaboom@3000.1.17/dist/kaboom.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
